<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us Form</title>
    <link rel="stylesheet" href="../css/contact-form.css">
</head>
<body>
    <div class="form-container">
        <h1>Game Development Outsourcing & Gamification Request Form</h1>
        <p class="subtitle">Please fill out the form below so we can address your inquiries better.</p>

        <form action="#" method="POST">
            <div class="form-row">
                <div class="form-group">
                    <label for="first-name">First Name</label>
                    <input type="text" id="first-name" name="first-name" placeholder="Write your first name" required>
                </div>
                <div class="form-group">
                    <label for="last-name">Last Name</label>
                    <input type="text" id="last-name" name="last-name" placeholder="Write your last name" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Write your email" required>
                </div>
                <div class="form-group">
                    <label for="phone">Phone</label>
                    <input type="tel" id="phone" name="phone" placeholder="Write your phone number">
                </div>
            </div>

            <div class="form-row full-width">
                <div class="form-group">
                    <label for="referral">Where do you learn about us?</label>
                    <input type="text" id="referral" name="referral" placeholder="Ads, referral, internet...">
                </div>
            </div>

            <div class="form-row full-width">
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" placeholder="Write your message" required></textarea>
                </div>
            </div>

            <!--kemungkinan tidak dipakai-->
            
            <!--<div class="form-row">
                <div class="form-group">
                    <label for="budget">Budget</label>
                    <select id="budget" name="budget">
                        <option value="10k-100k" selected>$10K - $100K (only for gamification)</option>
                        <option value="100k+">More than $100K</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="services">Services you needed?</label>
                    <select id="services" name="services">
                        <option value="full-game" selected>Full Game Development</option>
                        <option value="gamification">Gamification</option>
                    </select>
                </div>
            </div> -->

            <div class="recaptcha-mock">
                <div class="checkbox-container">
                    <input type="checkbox" id="robot" name="robot" required>
                    <label for="robot" class="robot-label">I'm not a robot</label>
                </div>
                <div class="recaptcha-logo">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/a/ad/RecaptchaLogo.svg/200px-RecaptchaLogo.svg.png" alt="reCAPTCHA" width="30">
                    <small>reCAPTCHA</small>
                </div>
            </div>

            <button type="submit" class="submit-btn">Submit</button>
        </form>
    </div>
</body>
</html>
